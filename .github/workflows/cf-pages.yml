name: Deploy to Cloudflare Pages

# 触发条件：
#   - push main 分支 → 自动部署到 CF Pages
#   - 手动 dispatch（Actions tab → Run workflow）→ 也可触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 权限：pages-action 默认 GITHUB_TOKEN 是 read-only，不需要写权限
# 如果以后要加 PR 评论部署链接，需要 'deployments: write'
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉源代码
      - uses: actions/checkout@v4

      # 2. 配 Ruby 3.1（Jekyll 3.10.0 需求，和 GitHub Pages 保持一致）
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      # 3. 安装 Jekyll & build
      #    锁定 Jekyll 3.10.0（GitHub Pages 同款），避免 Jekyll 4.x post layout 渲染 bug
      - name: Build Jekyll site
        run: |
          gem install jekyll -v '3.10.0' --no-document
          gem install bundler minima jekyll-feed kramdown-parser-gfm --no-document
          jekyll build

      # 4. 把 _site/ 部署到 Cloudflare Pages
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: durunzhe-blog
          directory: ./_site
          # gitHubToken 省略 · 默认 GITHUB_TOKEN 是 read-only 会接 deploy 里的 403
