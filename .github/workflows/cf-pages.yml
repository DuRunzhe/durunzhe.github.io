name: Deploy to Cloudflare Pages

# 触发条件：
#   - push main 分支 → 自动部署到 CF Pages
#   - 手动 dispatch（Actions tab → Run workflow）→ 也可触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 权限：pages-action 默认 GITHUB_TOKEN 是 read-only，不需要写权限
# 如果以后要加 PR 评论部署链接，需要 'deployments: write'
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉源代码
      - uses: actions/checkout@v4

      # 2. 配 Ruby 3.2（Jekyll 4.x 需求）
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # 3. 安装 Jekyll & build
      #    _config.yml 里 theme=minima + plugins=[jekyll-feed]，一起装
      - name: Build Jekyll site
        run: |
          gem install bundler jekyll minima jekyll-feed --no-document
          jekyll build

      # 4. 把 _site/ 部署到 Cloudflare Pages
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: durunzhe-blog
          directory: ./_site
          # gitHubToken 省略 · 默认 GITHUB_TOKEN 是 read-only 会接 deploy 里的 403
